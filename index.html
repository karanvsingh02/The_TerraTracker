<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5ecdf">
  <title>Terra Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: #f5ecdf;
      color: #302c29;
      font-family: ui-monospace, monospace;
      text-align: center;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 32px 20px;
    }
    h1 {
      margin: 0 0 28px;
      font-size: clamp(36px, 8vw, 64px);
      letter-spacing: -2px;
    }
    .continue {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 8px;
      background: #433a34;
      color: #fff6e9;
      font-size: 16px;
      text-decoration: none;
    }
    .continue:hover { background: #615045; }
    .continue:focus-visible { outline: 3px solid #776052; outline-offset: 5px; }
    footer { padding: 24px 20px; color: #756354; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Terra Tracker</h1>
    <a class="continue" href="frontend/index.html">Continue</a>
  </main>
  <footer>Provided by NASA and NOAA datasets.</footer>
</body>
</html>
